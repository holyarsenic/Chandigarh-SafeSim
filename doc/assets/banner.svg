  </g>
  <g fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="98" font-size="15" font-weight="600" letter-spacing="4" fill-opacity="0.75">URBAN SAFETY SIMULATION PLATFORM</text>
    <text x="68" y="166" font-size="62" font-weight="700">Chandigarh SafeSim</text>
    <rect x="70" y="190" width="72" height="4" rx="2" fill-opacity="0.9"/>
    <text x="70" y="232" font-size="20" fill-opacity="0.88">Incident simulation, emergency-facility discovery and AI guidance</text>
  </g>
