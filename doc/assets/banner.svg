  <g transform="translate(1040 150)" fill="none" stroke="#FFFFFF">
    <circle r="118" stroke-opacity="0.12" stroke-width="2"/>
    <circle r="84" stroke-opacity="0.22" stroke-width="2"/>
    <circle r="50" stroke-opacity="0.38" stroke-width="2"/>
